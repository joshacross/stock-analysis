services:
  - type: web
    name: stock-analysis-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.5"

  - type: web
    name: stock-analysis
    runtime: static
    rootDir: frontend
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: FRONTEND_URL
        value: https://stock-analysis.onrender.com
      - key: VITE_API_URL
        value: https://stock-analysis-api.onrender.com/api/chat
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
